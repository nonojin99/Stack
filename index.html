<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>STACK! 3D - 박스 쌓기</title>
<style>
  :root {
    --bg: #10121a;
    --panel: #1b1e2b;
    --panel-2: #232738;
    --text: #eef0f7;
    --muted: #9aa0b4;
    --accent: #ffb703;
    --accent-2: #4cc9f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    cursor: pointer;
    max-width: 100vw;
    max-height: 100vh;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 20, .72);
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .card {
    width: min(360px, 88vw);
    background: var(--panel);
    border: 1px solid #2c3147;
    border-radius: 16px;
    padding: 28px 26px;
    text-align: center;
    box-shadow: 0 16px 48px rgba(0,0,0,.55);
  }
  .card h1 {
    font-size: 38px;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .card h2 { font-size: 24px; margin-bottom: 10px; }
  .card p.desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 18px;
  }
  .big-score {
    font-size: 54px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
  }
  .sub-score {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .btn {
    display: inline-block;
    border: 0;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #1a1305;
    background: var(--accent);
    transition: transform .08s ease, filter .15s ease;
    margin: 4px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.96); }
  .btn.ghost {
    background: transparent;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
  }
  #name-row {
    display: flex;
    gap: 8px;
    margin: 14px 0 6px;
  }
  #name-input {
    flex: 1;
    min-width: 0;
    background: var(--panel-2);
    border: 1px solid #3a405c;
    border-radius: 10px;
    color: var(--text);
    padding: 11px 12px;
    font-size: 15px;
    outline: none;
  }
  #name-input:focus { border-color: var(--accent-2); }
  #save-msg {
    font-size: 13px;
    color: var(--accent-2);
    height: 18px;
    margin-bottom: 8px;
  }
  #rank-list {
    list-style: none;
    margin: 12px 0 16px;
    text-align: left;
    max-height: 46vh;
    overflow-y: auto;
  }
  #rank-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border-radius: 10px;
    padding: 9px 12px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  #rank-list li .rank {
    width: 26px;
    font-weight: 800;
    color: var(--muted);
    text-align: center;
    flex: none;
  }
  #rank-list li:nth-child(1) .rank { color: #ffd700; }
  #rank-list li:nth-child(2) .rank { color: #c0c0c0; }
  #rank-list li:nth-child(3) .rank { color: #cd7f32; }
  #rank-list li .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #rank-list li .score {
    font-weight: 800;
    color: var(--accent);
  }
  #rank-list li .date {
    font-size: 11px;
    color: var(--muted);
  }
  #rank-list li.empty {
    justify-content: center;
    color: var(--muted);
  }
  #rank-src {
    font-size: 12px;
    color: var(--muted);
    margin-top: -4px;
  }
  #hud {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  #hud .score {
    font-size: 46px;
    font-weight: 800;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  #hud .best {
    font-size: 13px;
    color: var(--muted);
  }
  #hud.hidden { display: none; }
  #btn-mute {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 20;
    background: rgba(27,30,43,.8);
    border: 1px solid #2c3147;
    border-radius: 10px;
    font-size: 18px;
    line-height: 1;
    padding: 9px 11px;
    cursor: pointer;
    color: var(--text);
  }
  #btn-mute:hover { border-color: var(--accent-2); }
  .mode-link {
    display: block;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
  }
  .mode-link:hover { color: var(--accent-2); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <button id="btn-mute" title="효과음 켜기/끄기">🔊</button>

  <div id="hud" class="hidden">
    <div class="score" id="hud-score">0</div>
    <div class="best" id="hud-best"></div>
  </div>

  <!-- 시작 화면 -->
  <div id="start-overlay" class="overlay">
    <div class="card">
      <h1>STACK! 3D</h1>
      <p class="desc">
        앞뒤·좌우 두 방향에서 번갈아 날아오는 박스를<br>
        <b>클릭(터치)</b>으로 떨어뜨려 쌓아 올리세요.<br>
        아래 박스와 <b>겹친 만큼만</b> 쌓이고,<br>
        다음 박스는 그 크기로 날아옵니다.<br>
        겹치지 않으면 게임 오버!
      </p>
      <button class="btn" id="btn-start">게임 시작</button>
      <button class="btn ghost" id="btn-rank-from-start">랭킹 보기</button>
      <a class="mode-link" href="2d.html">2D 클래식 모드로 플레이 →</a>
    </div>
  </div>

  <!-- 게임 오버 화면 -->
  <div id="over-overlay" class="overlay hidden">
    <div class="card">
      <h2>게임 오버</h2>
      <div class="big-score" id="final-score">0</div>
      <div class="sub-score" id="final-best"></div>
      <div id="name-row">
        <input id="name-input" maxlength="10" placeholder="이름 입력 (최대 10자)">
        <button class="btn" id="btn-save">등록</button>
      </div>
      <div id="save-msg"></div>
      <button class="btn" id="btn-retry">다시 하기</button>
      <button class="btn ghost" id="btn-rank-from-over">랭킹 보기</button>
    </div>
  </div>

  <!-- 랭킹 화면 -->
  <div id="rank-overlay" class="overlay hidden">
    <div class="card">
      <h2>🏆 랭킹 TOP 10</h2>
      <div id="rank-src"></div>
      <ol id="rank-list"></ol>
      <button class="btn" id="btn-rank-close">닫기</button>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
(() => {
  "use strict";

  // ===== 상수 =====
  const VIEW_W = 480;
  const VIEW_H = 640;
  const BOX_H = 26;            // 한 층 높이 (월드 단위)
  const BASE_SIZE = 150;       // 바닥 박스 한 변 크기
  const BASE_SPEED = 4.2;      // 초기 이동 속도
  const SPEED_STEP = 0.084;    // 층당 속도 증가
  const MAX_SPEED = 11.2;
  const MOVE_RANGE = 230;      // 왕복 이동 반경
  const HOVER = BOX_H * 2.2;   // 이동 중 박스가 떠 있는 높이
  const GRAVITY = 0.9;
  const PERFECT_TOL = 6;       // 퍼펙트 판정 오차
  const ISO_X = 0.866;         // cos30
  const ISO_Y = 0.5;           // sin30
  const RANK_KEY = "stack3d-game-ranking-v1";
  const BEST_KEY = "stack3d-game-best-v1";
  const RANK_MAX = 10;
  const GAME_MODE = "3d";

  // ===== 온라인 랭킹 (Supabase REST) =====
  const Remote = (() => {
    const cfg = window.SUPABASE_CONFIG || {};
    const enabled = !!(cfg.url && cfg.anonKey);
    const headers = enabled ? {
      apikey: cfg.anonKey,
      Authorization: "Bearer " + cfg.anonKey,
      "Content-Type": "application/json",
    } : null;
    async function fetchTop() {
      const url = cfg.url.replace(/\/$/, "") +
        "/rest/v1/rankings?mode=eq." + GAME_MODE +
        "&select=name,score,created_at" +
        "&order=score.desc,created_at.asc&limit=" + RANK_MAX;
      const res = await fetch(url, { headers });
      if (!res.ok) throw new Error("supabase " + res.status);
      return res.json();
    }
    async function submit(name, sc) {
      // submit_score 함수: 같은 (mode, name)의 기존 점수보다 높을 때만 기록/갱신
      const res = await fetch(cfg.url.replace(/\/$/, "") + "/rest/v1/rpc/submit_score", {
        method: "POST",
        headers: { ...headers, Prefer: "return=minimal" },
        body: JSON.stringify({ p_name: name, p_score: sc, p_mode: GAME_MODE }),
      });
      if (!res.ok) throw new Error("supabase " + res.status);
    }
    return { enabled, fetchTop, submit };
  })();

  // ===== 효과음 (Web Audio 합성, 외부 파일 없음) =====
  const SFX = (() => {
    const MUTE_KEY = "stack-game-muted";
    let actx = null;
    let muted = localStorage.getItem(MUTE_KEY) === "1";
    function ac() {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    }
    function tone(freq, dur, opts = {}) {
      const a = ac();
      if (!a || muted) return;
      const { type = "sine", vol = 0.25, freqEnd = freq, delay = 0 } = opts;
      const t0 = a.currentTime + delay;
      const osc = a.createOscillator();
      const g = a.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g).connect(a.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }
    function noise(dur, opts = {}) {
      const a = ac();
      if (!a || muted) return;
      const { vol = 0.2, freq = 1200, delay = 0 } = opts;
      const t0 = a.currentTime + delay;
      const len = Math.max(1, Math.floor(a.sampleRate * dur));
      const buf = a.createBuffer(1, len, a.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = a.createBufferSource();
      src.buffer = buf;
      const f = a.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.value = freq;
      const g = a.createGain();
      g.gain.value = vol;
      src.connect(f).connect(g).connect(a.destination);
      src.start(t0);
    }
    return {
      get muted() { return muted; },
      toggle() {
        muted = !muted;
        localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
        return muted;
      },
      unlock() { ac(); },
      drop() { noise(0.08, { vol: 0.1, freq: 900 }); },                     // 낙하 휙 소리
      place() {                                                              // 착지 퉁 소리
        tone(160, 0.12, { type: "triangle", vol: 0.35, freqEnd: 90 });
        noise(0.06, { vol: 0.16, freq: 700 });
      },
      cut() { noise(0.16, { vol: 0.2, freq: 2600 }); },                      // 조각 잘리는 소리
      perfect(streak) {                                                      // 퍼펙트: 연속마다 음정 상승
        const base = 523.25 * Math.pow(2, Math.min(streak, 12) / 12);
        tone(base, 0.18, { type: "sine", vol: 0.3 });
        tone(base * 1.5, 0.22, { type: "sine", vol: 0.2, delay: 0.06 });
      },
      over() {                                                               // 게임 오버: 하강음
        tone(330, 0.25, { type: "sawtooth", vol: 0.16, freqEnd: 220 });
        tone(220, 0.3, { type: "sawtooth", vol: 0.16, freqEnd: 130, delay: 0.18 });
        tone(147, 0.5, { type: "sawtooth", vol: 0.16, freqEnd: 80, delay: 0.38 });
      },
      ui() { tone(660, 0.06, { type: "square", vol: 0.07 }); },              // 버튼 클릭
    };
  })();

  // ===== 캔버스 =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const fit = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
    canvas.style.width = VIEW_W * fit + "px";
    canvas.style.height = VIEW_H * fit + "px";
    canvas.width = VIEW_W * fit * dpr;
    canvas.height = VIEW_H * fit * dpr;
    ctx.setTransform(fit * dpr, 0, 0, fit * dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const startOverlay = $("start-overlay");
  const overOverlay = $("over-overlay");
  const rankOverlay = $("rank-overlay");
  const hud = $("hud");
  const hudScore = $("hud-score");
  const hudBest = $("hud-best");

  // ===== 게임 상태 =====
  // state: "idle" | "moving" | "dropping" | "gameover"
  let state = "idle";
  // 쌓인 박스: {x, z, w, d, y, hue}  (x/z: 최소 모서리, w/d: x/z 크기, y: 바닥 높이)
  let stack = [];
  let mover = null;    // {x, z, w, d, y, axis: "x"|"z", dir, speed, hue}
  let dropper = null;  // {x, z, w, d, y, vy, hue}
  let debris = [];     // {x, z, w, d, y, vy, va, axis, hue, alpha}
  let score = 0;
  let cameraY = 0;     // 탑 높이에 따른 화면 오프셋
  let cameraTarget = 0;
  let flash = null;
  let shake = 0;
  let savedThisRun = false;
  let perfectStreak = 0;

  const GROUND_Y = 470; // 월드 y=0, (x+z)=0 지점의 화면 y

  function topBox() { return stack[stack.length - 1]; }
  function towerTopY() { return stack.length * BOX_H; } // 탑 꼭대기 월드 높이

  function hueFor(i) { return (i * 8) % 360; }

  // 아이소메트릭 투영: 월드(px, pz, py) -> 화면 [sx, sy]
  function P(px, pz, py) {
    return [
      VIEW_W / 2 + (px - pz) * ISO_X,
      GROUND_Y + (px + pz) * ISO_Y - py + cameraY,
    ];
  }

  function reset() {
    stack = [{ x: -BASE_SIZE / 2, z: -BASE_SIZE / 2, w: BASE_SIZE, d: BASE_SIZE, y: 0, hue: hueFor(0) }];
    mover = null;
    dropper = null;
    debris = [];
    score = 0;
    cameraY = 0;
    cameraTarget = 0;
    flash = null;
    shake = 0;
    savedThisRun = false;
    perfectStreak = 0;
    updateHud();
  }

  function spawnMover() {
    const top = topBox();
    const level = stack.length;
    const axis = level % 2 === 1 ? "x" : "z"; // 층마다 이동축 교대
    const speed = Math.min(BASE_SPEED + level * SPEED_STEP, MAX_SPEED);
    const m = {
      x: top.x, z: top.z, w: top.w, d: top.d,
      y: towerTopY() + HOVER,
      axis, speed, hue: hueFor(level),
    };
    // 이동축 기준으로 탑 중심에서 -MOVE_RANGE 만큼 떨어진 곳에서 진입
    if (axis === "x") {
      m.x = top.x - MOVE_RANGE;
      m.dir = 1;
    } else {
      m.z = top.z - MOVE_RANGE;
      m.dir = 1;
    }
    mover = m;
    state = "moving";
  }

  function startGame() {
    reset();
    startOverlay.classList.add("hidden");
    overOverlay.classList.add("hidden");
    rankOverlay.classList.add("hidden");
    hud.classList.remove("hidden");
    spawnMover();
  }

  // ===== 입력 =====
  function onAction() {
    if (state === "moving" && mover) {
      dropper = { x: mover.x, z: mover.z, w: mover.w, d: mover.d, y: mover.y, vy: 0, hue: mover.hue, axis: mover.axis };
      mover = null;
      state = "dropping";
      SFX.drop();
    }
  }
  canvas.addEventListener("pointerdown", onAction);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      if (state === "moving") { e.preventDefault(); onAction(); }
    }
  });

  // ===== 판정 =====
  function landDropper() {
    const top = topBox();
    const axis = dropper.axis;
    const a0 = axis === "x" ? dropper.x : dropper.z;
    const size = axis === "x" ? dropper.w : dropper.d;
    const t0 = axis === "x" ? top.x : top.z;
    const tSize = axis === "x" ? top.w : top.d;
    const left = Math.max(a0, t0);
    const right = Math.min(a0 + size, t0 + tSize);
    const overlap = right - left;

    if (overlap <= 0) {
      // 교집합 없음 → 통째로 낙하하며 게임 오버
      debris.push({
        x: dropper.x, z: dropper.z, w: dropper.w, d: dropper.d,
        y: dropper.y, vy: -1, va: a0 < t0 ? -2.5 : 2.5,
        axis, hue: dropper.hue, alpha: 1,
      });
      dropper = null;
      gameOver();
      return;
    }

    const offset = a0 - t0;
    let n0, nSize;
    if (Math.abs(offset) <= PERFECT_TOL && Math.abs(size - tSize) <= PERFECT_TOL) {
      // 퍼펙트: 자르지 않고 정렬
      n0 = t0;
      nSize = tSize;
      flash = { text: "PERFECT!", time: 60 };
      perfectStreak++;
      SFX.perfect(perfectStreak);
    } else {
      n0 = left;
      nSize = overlap;
      perfectStreak = 0;
      SFX.place();
      // 잘려나간 조각
      let cutMade = false;
      if (a0 < left) {
        debris.push(makeDebris(axis, a0, left - a0, dropper, -2.5));
        cutMade = true;
      }
      if (a0 + size > right) {
        debris.push(makeDebris(axis, right, a0 + size - right, dropper, 2.5));
        cutMade = true;
      }
      if (cutMade) SFX.cut();
    }

    const nb = { x: top.x, z: top.z, w: top.w, d: top.d, y: towerTopY(), hue: dropper.hue };
    if (axis === "x") { nb.x = n0; nb.w = nSize; nb.z = dropper.z; nb.d = dropper.d; }
    else { nb.z = n0; nb.d = nSize; nb.x = dropper.x; nb.w = dropper.w; }
    stack.push(nb);
    dropper = null;
    score = stack.length - 1;
    updateHud();
    shake = 6;

    // 카메라: 탑 꼭대기가 화면 45% 위로 올라가면 따라 올라감
    const topScreen = GROUND_Y - towerTopY() + cameraTarget;
    if (topScreen < VIEW_H * 0.42) {
      cameraTarget = VIEW_H * 0.42 - GROUND_Y + towerTopY();
    }

    spawnMover();
  }

  function makeDebris(axis, start, size, src, va) {
    const d = {
      x: src.x, z: src.z, w: src.w, d: src.d,
      y: src.y, vy: 1.5, va, axis, hue: src.hue, alpha: 1,
    };
    if (axis === "x") { d.x = start; d.w = size; }
    else { d.z = start; d.d = size; }
    return d;
  }

  function gameOver() {
    state = "gameover";
    SFX.over();
    const best = Math.max(score, getBest());
    localStorage.setItem(BEST_KEY, String(best));
    $("final-score").textContent = score + "층";
    $("final-best").textContent = "최고 기록: " + best + "층";
    $("save-msg").textContent = "";
    $("name-input").value = localStorage.getItem("stack-game-name") || "";
    setTimeout(() => {
      overOverlay.classList.remove("hidden");
      hud.classList.add("hidden");
    }, 650);
  }

  // ===== 랭킹 =====
  function getRanking() {
    try {
      const raw = JSON.parse(localStorage.getItem(RANK_KEY) || "[]");
      return Array.isArray(raw) ? raw : [];
    } catch { return []; }
  }
  function getBest() {
    return parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;
  }
  function saveScore(name) {
    // 이름당 최고 점수 한 건만 유지
    const list = getRanking();
    const today = new Date().toISOString().slice(0, 10);
    const existing = list.find((r) => r.name === name);
    if (existing) {
      if (score > existing.score) {
        existing.score = score;
        existing.date = today;
      }
    } else {
      list.push({ name, score, date: today });
    }
    list.sort((a, b) => b.score - a.score);
    localStorage.setItem(RANK_KEY, JSON.stringify(list.slice(0, RANK_MAX)));
  }
  async function renderRanking() {
    const ol = $("rank-list");
    const src = $("rank-src");
    ol.innerHTML = '<li class="empty">불러오는 중...</li>';
    src.textContent = "";

    let list = null;
    let online = false;
    if (Remote.enabled) {
      try {
        list = (await Remote.fetchTop()).map((r) => ({
          name: r.name,
          score: r.score,
          date: (r.created_at || "").slice(0, 10),
        }));
        online = true;
      } catch { /* 서버 실패 시 로컬로 폴백 */ }
    }
    if (!list) list = getRanking();
    src.textContent = Remote.enabled
      ? (online ? "🌐 온라인 전체 랭킹" : "⚠️ 서버 연결 실패 — 내 브라우저 기록")
      : "내 브라우저 기록 (오프라인)";

    ol.innerHTML = "";
    if (list.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "아직 기록이 없습니다";
      ol.appendChild(li);
      return;
    }
    list.forEach((r, i) => {
      const li = document.createElement("li");
      const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
      li.innerHTML =
        '<span class="rank">' + medal + '</span>' +
        '<span class="name"></span>' +
        '<span class="date">' + r.date + '</span>' +
        '<span class="score">' + r.score + '층</span>';
      li.querySelector(".name").textContent = r.name;
      ol.appendChild(li);
    });
  }

  // ===== HUD =====
  function updateHud() {
    hudScore.textContent = score;
    const best = getBest();
    hudBest.textContent = best > 0 ? "BEST " + best : "";
  }

  // ===== 버튼 =====
  function startWithSound() {
    SFX.unlock();
    SFX.ui();
    startGame();
  }
  $("btn-start").addEventListener("click", startWithSound);
  $("btn-retry").addEventListener("click", startWithSound);

  const muteBtn = $("btn-mute");
  function renderMute() { muteBtn.textContent = SFX.muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    SFX.unlock();
    SFX.toggle();
    renderMute();
    if (!SFX.muted) SFX.ui();
  });
  renderMute();
  $("btn-save").addEventListener("click", async () => {
    if (savedThisRun) return;
    savedThisRun = true;
    const name = $("name-input").value.trim() || "이름없음";
    localStorage.setItem("stack-game-name", name);
    saveScore(name); // 로컬에는 항상 저장
    if (Remote.enabled) {
      $("save-msg").textContent = "등록 중...";
      try {
        await Remote.submit(name, score);
        $("save-msg").textContent = "온라인 랭킹에 등록되었습니다!";
      } catch {
        $("save-msg").textContent = "서버 오류 — 이 브라우저에만 저장되었습니다";
      }
    } else {
      $("save-msg").textContent = "랭킹에 등록되었습니다! (오프라인)";
    }
  });
  $("name-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("btn-save").click();
    e.stopPropagation();
  });
  function openRank() {
    renderRanking();
    rankOverlay.classList.remove("hidden");
  }
  $("btn-rank-from-start").addEventListener("click", openRank);
  $("btn-rank-from-over").addEventListener("click", openRank);
  $("btn-rank-close").addEventListener("click", () => {
    rankOverlay.classList.add("hidden");
  });

  // ===== 업데이트 =====
  // f: 60fps 기준 경과 프레임 수 (120Hz면 0.5, 30fps면 2) — 주사율과 무관하게 같은 속도 유지
  function update(f) {
    cameraY += (cameraTarget - cameraY) * (1 - Math.pow(0.9, f));
    if (shake > 0) shake *= Math.pow(0.85, f);

    if (state === "moving" && mover) {
      const top = topBox();
      if (mover.axis === "x") {
        mover.x += mover.dir * mover.speed * f;
        if (mover.dir > 0 && mover.x > top.x + MOVE_RANGE) mover.dir = -1;
        if (mover.dir < 0 && mover.x < top.x - MOVE_RANGE) mover.dir = 1;
      } else {
        mover.z += mover.dir * mover.speed * f;
        if (mover.dir > 0 && mover.z > top.z + MOVE_RANGE) mover.dir = -1;
        if (mover.dir < 0 && mover.z < top.z - MOVE_RANGE) mover.dir = 1;
      }
    }

    if (state === "dropping" && dropper) {
      dropper.vy += GRAVITY * f;
      dropper.y -= dropper.vy * f;
      const targetY = towerTopY();
      if (dropper.y <= targetY) {
        dropper.y = targetY;
        landDropper();
      }
    }

    for (const d of debris) {
      d.vy += GRAVITY * 0.6 * f;
      d.y -= d.vy * f;
      if (d.axis === "x") d.x += d.va * f;
      else d.z += d.va * f;
      d.alpha -= 0.01 * f;
    }
    debris = debris.filter((d) => d.alpha > 0);

    if (flash) {
      flash.time -= f;
      if (flash.time <= 0) flash = null;
    }
  }

  // ===== 렌더 =====
  function face(points, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  // 3D 박스 그리기 (윗면 + 오른쪽면(x+) + 왼쪽면(z+))
  function drawBox(b, alpha = 1) {
    const x0 = b.x, x1 = b.x + b.w;
    const z0 = b.z, z1 = b.z + b.d;
    const y0 = b.y, y1 = b.y + BOX_H;
    // 화면 밖이면 스킵
    const [, syTop] = P(x0, z0, y1);
    const [, syBot] = P(x1, z1, y0);
    if (syTop > VIEW_H + 60 || syBot < -60) return;

    ctx.globalAlpha = Math.max(alpha, 0);
    const h = b.hue;
    // 윗면
    face([P(x0, z0, y1), P(x1, z0, y1), P(x1, z1, y1), P(x0, z1, y1)],
      "hsl(" + h + ", 62%, 64%)");
    // 오른쪽면 (x = x1)
    face([P(x1, z0, y1), P(x1, z1, y1), P(x1, z1, y0), P(x1, z0, y0)],
      "hsl(" + h + ", 58%, 48%)");
    // 왼쪽면 (z = z1)
    face([P(x0, z1, y1), P(x1, z1, y1), P(x1, z1, y0), P(x0, z1, y0)],
      "hsl(" + h + ", 55%, 36%)");
    ctx.globalAlpha = 1;
  }

  function render() {
    // 배경: 높이에 따라 서서히 색이 변하는 그라데이션
    const bh = (210 + score * 3) % 360;
    const grad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    grad.addColorStop(0, "hsl(" + bh + ", 30%, 13%)");
    grad.addColorStop(1, "hsl(" + ((bh + 40) % 360) + ", 25%, 7%)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    ctx.save();
    if (shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // 바닥 그림자 (탑 아래)
    const base = stack[0];
    if (base) {
      const s = 30;
      ctx.globalAlpha = 0.35;
      face([
        P(base.x - s, base.z - s, 0), P(base.x + base.w + s, base.z - s, 0),
        P(base.x + base.w + s, base.z + base.d + s, 0), P(base.x - s, base.z + base.d + s, 0),
      ], "#000");
      ctx.globalAlpha = 1;
    }

    // 쌓인 박스 (아래→위)
    for (const b of stack) drawBox(b);

    // 잘린 조각
    for (const d of debris) drawBox(d, d.alpha);

    // 이동/낙하 중 박스
    if (mover) drawBox(mover);
    if (dropper) drawBox(dropper);

    // 퍼펙트 표시
    if (flash) {
      const [fx, fy] = P(0, 0, towerTopY() + BOX_H * 3);
      ctx.globalAlpha = Math.min(flash.time / 30, 1);
      ctx.fillStyle = "#ffd700";
      ctx.font = "800 30px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(flash.text, fx, fy);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  let lastTime = 0;
  function loop(now) {
    if (!lastTime) lastTime = now;
    // 탭 전환 등으로 간격이 크게 벌어지면 3프레임까지만 진행 (박스가 순간이동하는 것 방지)
    const f = Math.min((now - lastTime) / (1000 / 60), 3);
    lastTime = now;
    update(f);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  updateHud();

  // 테스트/디버그용 훅 (게임 플레이에는 영향 없음)
  window.__stackTest = {
    getState: () => {
      const top = topBox();
      return {
        state,
        score,
        mover: mover ? {
          axis: mover.axis,
          m: mover.axis === "x" ? mover.x : mover.z,
          size: mover.axis === "x" ? mover.w : mover.d,
        } : null,
        top: top ? {
          x: top.x, z: top.z, w: top.w, d: top.d,
        } : null,
      };
    },
    drop: onAction,
  };
})();
</script>

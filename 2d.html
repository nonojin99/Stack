<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>STACK! - 박스 쌓기</title>
<style>
  :root {
    --bg: #10121a;
    --panel: #1b1e2b;
    --panel-2: #232738;
    --text: #eef0f7;
    --muted: #9aa0b4;
    --accent: #ffb703;
    --accent-2: #4cc9f0;
    --danger: #ef476f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    background: linear-gradient(#171a26 0%, #10121a 100%);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    cursor: pointer;
    max-width: 100vw;
    max-height: 100vh;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 20, .72);
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .card {
    width: min(360px, 88vw);
    background: var(--panel);
    border: 1px solid #2c3147;
    border-radius: 16px;
    padding: 28px 26px;
    text-align: center;
    box-shadow: 0 16px 48px rgba(0,0,0,.55);
  }
  .card h1 {
    font-size: 40px;
    letter-spacing: 4px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .card h2 { font-size: 24px; margin-bottom: 10px; }
  .card p.desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 18px;
  }
  .big-score {
    font-size: 54px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
  }
  .sub-score {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .btn {
    display: inline-block;
    border: 0;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #1a1305;
    background: var(--accent);
    transition: transform .08s ease, filter .15s ease;
    margin: 4px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.96); }
  .btn.ghost {
    background: transparent;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
  }
  #name-row {
    display: flex;
    gap: 8px;
    margin: 14px 0 6px;
  }
  #name-input {
    flex: 1;
    min-width: 0;
    background: var(--panel-2);
    border: 1px solid #3a405c;
    border-radius: 10px;
    color: var(--text);
    padding: 11px 12px;
    font-size: 15px;
    outline: none;
  }
  #name-input:focus { border-color: var(--accent-2); }
  #save-msg {
    font-size: 13px;
    color: var(--accent-2);
    height: 18px;
    margin-bottom: 8px;
  }
  #rank-list {
    list-style: none;
    margin: 12px 0 16px;
    text-align: left;
    max-height: 46vh;
    overflow-y: auto;
  }
  #rank-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border-radius: 10px;
    padding: 9px 12px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  #rank-list li .rank {
    width: 26px;
    font-weight: 800;
    color: var(--muted);
    text-align: center;
    flex: none;
  }
  #rank-list li:nth-child(1) .rank { color: #ffd700; }
  #rank-list li:nth-child(2) .rank { color: #c0c0c0; }
  #rank-list li:nth-child(3) .rank { color: #cd7f32; }
  #rank-list li .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #rank-list li .score {
    font-weight: 800;
    color: var(--accent);
  }
  #rank-list li .date {
    font-size: 11px;
    color: var(--muted);
  }
  #rank-list li.empty {
    justify-content: center;
    color: var(--muted);
  }
  #rank-src {
    font-size: 12px;
    color: var(--muted);
    margin-top: -4px;
  }
  #hud {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  #hud .score {
    font-size: 44px;
    font-weight: 800;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  #hud .best {
    font-size: 13px;
    color: var(--muted);
  }
  #hud.hidden { display: none; }
  #btn-mute {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 20;
    background: rgba(27,30,43,.8);
    border: 1px solid #2c3147;
    border-radius: 10px;
    font-size: 18px;
    line-height: 1;
    padding: 9px 11px;
    cursor: pointer;
    color: var(--text);
  }
  #btn-mute:hover { border-color: var(--accent-2); }
  .mode-link {
    display: block;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
  }
  .mode-link:hover { color: var(--accent-2); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <button id="btn-mute" title="효과음 켜기/끄기">🔊</button>

  <div id="hud" class="hidden">
    <div class="score" id="hud-score">0</div>
    <div class="best" id="hud-best"></div>
  </div>

  <!-- 시작 화면 -->
  <div id="start-overlay" class="overlay">
    <div class="card">
      <h1>STACK!</h1>
      <p class="desc">
        좌우에서 번갈아 날아오는 박스를<br>
        <b>클릭(터치)</b>으로 떨어뜨려 쌓아 올리세요.<br>
        아래 박스와 <b>겹친 만큼만</b> 쌓이고,<br>
        다음 박스는 그 크기로 날아옵니다.<br>
        겹치지 않으면 게임 오버!
      </p>
      <button class="btn" id="btn-start">게임 시작</button>
      <button class="btn ghost" id="btn-rank-from-start">랭킹 보기</button>
      <a class="mode-link" href="index.html">3D 모드로 플레이 →</a>
    </div>
  </div>

  <!-- 게임 오버 화면 -->
  <div id="over-overlay" class="overlay hidden">
    <div class="card">
      <h2>게임 오버</h2>
      <div class="big-score" id="final-score">0</div>
      <div class="sub-score" id="final-best"></div>
      <div id="name-row">
        <input id="name-input" maxlength="10" placeholder="이름 입력 (최대 10자)">
        <button class="btn" id="btn-save">등록</button>
      </div>
      <div id="save-msg"></div>
      <button class="btn" id="btn-retry">다시 하기</button>
      <button class="btn ghost" id="btn-rank-from-over">랭킹 보기</button>
    </div>
  </div>

  <!-- 랭킹 화면 -->
  <div id="rank-overlay" class="overlay hidden">
    <div class="card">
      <h2>🏆 랭킹 TOP 10</h2>
      <div id="rank-src"></div>
      <ol id="rank-list"></ol>
      <button class="btn" id="btn-rank-close">닫기</button>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
(() => {
  "use strict";

  // ===== 상수 =====
  const VIEW_W = 480;          // 논리 캔버스 크기
  const VIEW_H = 640;
  const BOX_H = 34;            // 박스 한 층 높이
  const BASE_W = 220;          // 시작(바닥) 박스 너비
  const BASE_SPEED = 3.64;     // 초기 이동 속도
  const SPEED_STEP = 0.077;    // 층당 속도 증가
  const MAX_SPEED = 10.5;
  const GRAVITY = 0.65;        // 낙하 가속도
  const PERFECT_TOL = 5;       // 이 오차 이하면 퍼펙트(자르지 않음)
  const RANK_KEY = "stack-game-ranking-v1";
  const BEST_KEY = "stack-game-best-v1";
  const RANK_MAX = 10;
  const GAME_MODE = "2d";

  // ===== 온라인 랭킹 (Supabase REST) =====
  const Remote = (() => {
    const cfg = window.SUPABASE_CONFIG || {};
    const enabled = !!(cfg.url && cfg.anonKey);
    const headers = enabled ? {
      apikey: cfg.anonKey,
      Authorization: "Bearer " + cfg.anonKey,
      "Content-Type": "application/json",
    } : null;
    async function fetchTop() {
      const url = cfg.url.replace(/\/$/, "") +
        "/rest/v1/rankings?mode=eq." + GAME_MODE +
        "&select=name,score,created_at" +
        "&order=score.desc,created_at.asc&limit=" + RANK_MAX;
      const res = await fetch(url, { headers });
      if (!res.ok) throw new Error("supabase " + res.status);
      return res.json();
    }
    async function submit(name, sc) {
      // submit_score 함수: 같은 (mode, name)의 기존 점수보다 높을 때만 기록/갱신
      const res = await fetch(cfg.url.replace(/\/$/, "") + "/rest/v1/rpc/submit_score", {
        method: "POST",
        headers: { ...headers, Prefer: "return=minimal" },
        body: JSON.stringify({ p_name: name, p_score: sc, p_mode: GAME_MODE }),
      });
      if (!res.ok) throw new Error("supabase " + res.status);
    }
    return { enabled, fetchTop, submit };
  })();

  // ===== 효과음 (Web Audio 합성, 외부 파일 없음) =====
  const SFX = (() => {
    const MUTE_KEY = "stack-game-muted";
    let actx = null;
    let muted = localStorage.getItem(MUTE_KEY) === "1";
    function ac() {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    }
    function tone(freq, dur, opts = {}) {
      const a = ac();
      if (!a || muted) return;
      const { type = "sine", vol = 0.25, freqEnd = freq, delay = 0 } = opts;
      const t0 = a.currentTime + delay;
      const osc = a.createOscillator();
      const g = a.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g).connect(a.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }
    function noise(dur, opts = {}) {
      const a = ac();
      if (!a || muted) return;
      const { vol = 0.2, freq = 1200, delay = 0 } = opts;
      const t0 = a.currentTime + delay;
      const len = Math.max(1, Math.floor(a.sampleRate * dur));
      const buf = a.createBuffer(1, len, a.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = a.createBufferSource();
      src.buffer = buf;
      const f = a.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.value = freq;
      const g = a.createGain();
      g.gain.value = vol;
      src.connect(f).connect(g).connect(a.destination);
      src.start(t0);
    }
    return {
      get muted() { return muted; },
      toggle() {
        muted = !muted;
        localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
        return muted;
      },
      unlock() { ac(); },
      drop() { noise(0.08, { vol: 0.1, freq: 900 }); },                     // 낙하 휙 소리
      place() {                                                              // 착지 퉁 소리
        tone(160, 0.12, { type: "triangle", vol: 0.35, freqEnd: 90 });
        noise(0.06, { vol: 0.16, freq: 700 });
      },
      cut() { noise(0.16, { vol: 0.2, freq: 2600 }); },                      // 조각 잘리는 소리
      perfect(streak) {                                                      // 퍼펙트: 연속마다 음정 상승
        const base = 523.25 * Math.pow(2, Math.min(streak, 12) / 12);
        tone(base, 0.18, { type: "sine", vol: 0.3 });
        tone(base * 1.5, 0.22, { type: "sine", vol: 0.2, delay: 0.06 });
      },
      over() {                                                               // 게임 오버: 하강음
        tone(330, 0.25, { type: "sawtooth", vol: 0.16, freqEnd: 220 });
        tone(220, 0.3, { type: "sawtooth", vol: 0.16, freqEnd: 130, delay: 0.18 });
        tone(147, 0.5, { type: "sawtooth", vol: 0.16, freqEnd: 80, delay: 0.38 });
      },
      ui() { tone(660, 0.06, { type: "square", vol: 0.07 }); },              // 버튼 클릭
    };
  })();

  // ===== 캔버스 =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let scale = 1;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const fit = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
    scale = fit;
    canvas.style.width = VIEW_W * fit + "px";
    canvas.style.height = VIEW_H * fit + "px";
    canvas.width = VIEW_W * fit * dpr;
    canvas.height = VIEW_H * fit * dpr;
    ctx.setTransform(fit * dpr, 0, 0, fit * dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const startOverlay = $("start-overlay");
  const overOverlay = $("over-overlay");
  const rankOverlay = $("rank-overlay");
  const hud = $("hud");
  const hudScore = $("hud-score");
  const hudBest = $("hud-best");

  // ===== 게임 상태 =====
  // state: "idle" | "moving" | "dropping" | "gameover"
  let state = "idle";
  let stack = [];       // 쌓인 박스 [{x, w, y, hue}] (y는 월드 좌표, 아래에서 위로)
  let mover = null;     // 이동 중인 박스 {x, w, y, dir, speed, hue}
  let dropper = null;   // 낙하 중인 박스 {x, w, y, vy, hue}
  let debris = [];      // 잘려나간 조각 {x, w, y, vx, vy, rot, vr, hue, alpha}
  let score = 0;
  let fromLeft = true;  // 다음 박스가 왼쪽에서 오는지
  let cameraY = 0;      // 월드->화면 오프셋 (부드럽게 따라감)
  let cameraTarget = 0;
  let flash = null;     // {text, time} 퍼펙트 표시
  let shake = 0;        // 화면 흔들림
  let savedThisRun = false;
  let perfectStreak = 0;

  const floorY = VIEW_H - 60; // 바닥 박스 윗면의 화면 기준 y (카메라 0일 때)

  function topBox() { return stack[stack.length - 1]; }

  function stackTopY() {
    // 현재 쌓인 탑 꼭대기의 월드 y (박스 윗면)
    return floorY - stack.length * BOX_H;
  }

  function hueFor(i) { return (i * 9) % 360; }

  function reset() {
    stack = [{ x: (VIEW_W - BASE_W) / 2, w: BASE_W, y: floorY - BOX_H, hue: hueFor(0) }];
    mover = null;
    dropper = null;
    debris = [];
    score = 0;
    fromLeft = true;
    cameraY = 0;
    cameraTarget = 0;
    flash = null;
    shake = 0;
    savedThisRun = false;
    perfectStreak = 0;
    updateHud();
  }

  function spawnMover() {
    const top = topBox();
    const w = top.w;
    const speed = Math.min(BASE_SPEED + stack.length * SPEED_STEP, MAX_SPEED);
    mover = {
      w,
      x: fromLeft ? -w : VIEW_W,
      y: stackTopY() - BOX_H,
      dir: fromLeft ? 1 : -1,
      speed,
      hue: hueFor(stack.length),
    };
    fromLeft = !fromLeft;
    state = "moving";
  }

  function startGame() {
    reset();
    startOverlay.classList.add("hidden");
    overOverlay.classList.add("hidden");
    rankOverlay.classList.add("hidden");
    hud.classList.remove("hidden");
    spawnMover();
  }

  // ===== 입력 =====
  function onAction() {
    if (state === "moving" && mover) {
      dropper = { x: mover.x, w: mover.w, y: mover.y, vy: 0, hue: mover.hue };
      mover = null;
      state = "dropping";
      SFX.drop();
    }
  }
  canvas.addEventListener("pointerdown", onAction);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      if (state === "moving") { e.preventDefault(); onAction(); }
    }
  });

  // ===== 판정 =====
  function landDropper() {
    const top = topBox();
    const left = Math.max(dropper.x, top.x);
    const right = Math.min(dropper.x + dropper.w, top.x + top.w);
    const overlap = right - left;

    if (overlap <= 0) {
      // 교집합 없음 → 통째로 떨어지며 게임 오버
      debris.push({
        x: dropper.x, w: dropper.w, y: dropper.y,
        vx: dropper.x < top.x ? -2 : 2, vy: 2, rot: 0,
        vr: dropper.x < top.x ? -0.06 : 0.06,
        hue: dropper.hue, alpha: 1,
      });
      dropper = null;
      gameOver();
      return;
    }

    const offset = dropper.x - top.x;
    let newX, newW;
    if (Math.abs(offset) <= PERFECT_TOL && Math.abs(dropper.w - top.w) <= PERFECT_TOL) {
      // 퍼펙트: 자르지 않고 그대로 정렬
      newX = top.x;
      newW = top.w;
      flash = { text: "PERFECT!", time: 60 };
      perfectStreak++;
      SFX.perfect(perfectStreak);
    } else {
      newX = left;
      newW = overlap;
      perfectStreak = 0;
      SFX.place();
      // 잘려나간 조각 생성
      let cutMade = false;
      if (dropper.x < left) {
        debris.push({
          x: dropper.x, w: left - dropper.x, y: dropper.y,
          vx: -2.2, vy: -1.5, rot: 0, vr: -0.08, hue: dropper.hue, alpha: 1,
        });
        cutMade = true;
      }
      if (dropper.x + dropper.w > right) {
        debris.push({
          x: right, w: dropper.x + dropper.w - right, y: dropper.y,
          vx: 2.2, vy: -1.5, rot: 0, vr: 0.08, hue: dropper.hue, alpha: 1,
        });
        cutMade = true;
      }
      if (cutMade) SFX.cut();
    }

    stack.push({ x: newX, w: newW, y: dropper.y, hue: dropper.hue });
    dropper = null;
    score = stack.length - 1; // 바닥 박스 제외
    updateHud();
    shake = 6;

    // 카메라: 탑이 높아지면 위로 스크롤
    const topScreenY = stackTopY() - cameraTarget;
    if (topScreenY < VIEW_H * 0.45) {
      cameraTarget = stackTopY() - VIEW_H * 0.45;
    }

    spawnMover();
  }

  function gameOver() {
    state = "gameover";
    SFX.over();
    const best = Math.max(score, getBest());
    localStorage.setItem(BEST_KEY, String(best));
    $("final-score").textContent = score + "층";
    $("final-best").textContent = "최고 기록: " + best + "층";
    $("save-msg").textContent = "";
    $("name-input").value = localStorage.getItem("stack-game-name") || "";
    setTimeout(() => {
      overOverlay.classList.remove("hidden");
      hud.classList.add("hidden");
    }, 650);
  }

  // ===== 랭킹 =====
  function getRanking() {
    try {
      const raw = JSON.parse(localStorage.getItem(RANK_KEY) || "[]");
      return Array.isArray(raw) ? raw : [];
    } catch { return []; }
  }
  function getBest() {
    return parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;
  }
  function saveScore(name) {
    // 이름당 최고 점수 한 건만 유지
    const list = getRanking();
    const today = new Date().toISOString().slice(0, 10);
    const existing = list.find((r) => r.name === name);
    if (existing) {
      if (score > existing.score) {
        existing.score = score;
        existing.date = today;
      }
    } else {
      list.push({ name, score, date: today });
    }
    list.sort((a, b) => b.score - a.score);
    localStorage.setItem(RANK_KEY, JSON.stringify(list.slice(0, RANK_MAX)));
  }
  async function renderRanking() {
    const ol = $("rank-list");
    const src = $("rank-src");
    ol.innerHTML = '<li class="empty">불러오는 중...</li>';
    src.textContent = "";

    let list = null;
    let online = false;
    if (Remote.enabled) {
      try {
        list = (await Remote.fetchTop()).map((r) => ({
          name: r.name,
          score: r.score,
          date: (r.created_at || "").slice(0, 10),
        }));
        online = true;
      } catch { /* 서버 실패 시 로컬로 폴백 */ }
    }
    if (!list) list = getRanking();
    src.textContent = Remote.enabled
      ? (online ? "🌐 온라인 전체 랭킹" : "⚠️ 서버 연결 실패 — 내 브라우저 기록")
      : "내 브라우저 기록 (오프라인)";

    ol.innerHTML = "";
    if (list.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "아직 기록이 없습니다";
      ol.appendChild(li);
      return;
    }
    list.forEach((r, i) => {
      const li = document.createElement("li");
      const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
      li.innerHTML =
        '<span class="rank">' + medal + '</span>' +
        '<span class="name"></span>' +
        '<span class="date">' + r.date + '</span>' +
        '<span class="score">' + r.score + '층</span>';
      li.querySelector(".name").textContent = r.name;
      ol.appendChild(li);
    });
  }

  // ===== HUD =====
  function updateHud() {
    hudScore.textContent = score;
    const best = getBest();
    hudBest.textContent = best > 0 ? "BEST " + best : "";
  }

  // ===== 버튼 =====
  function startWithSound() {
    SFX.unlock();
    SFX.ui();
    startGame();
  }
  $("btn-start").addEventListener("click", startWithSound);
  $("btn-retry").addEventListener("click", startWithSound);

  const muteBtn = $("btn-mute");
  function renderMute() { muteBtn.textContent = SFX.muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    SFX.unlock();
    SFX.toggle();
    renderMute();
    if (!SFX.muted) SFX.ui();
  });
  renderMute();
  $("btn-save").addEventListener("click", async () => {
    if (savedThisRun) return;
    savedThisRun = true;
    const name = $("name-input").value.trim() || "이름없음";
    localStorage.setItem("stack-game-name", name);
    saveScore(name); // 로컬에는 항상 저장
    if (Remote.enabled) {
      $("save-msg").textContent = "등록 중...";
      try {
        await Remote.submit(name, score);
        $("save-msg").textContent = "온라인 랭킹에 등록되었습니다!";
      } catch {
        $("save-msg").textContent = "서버 오류 — 이 브라우저에만 저장되었습니다";
      }
    } else {
      $("save-msg").textContent = "랭킹에 등록되었습니다! (오프라인)";
    }
  });
  $("name-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("btn-save").click();
    e.stopPropagation();
  });
  function openRank(from) {
    renderRanking();
    rankOverlay.classList.remove("hidden");
    rankOverlay.dataset.from = from;
  }
  $("btn-rank-from-start").addEventListener("click", () => openRank("start"));
  $("btn-rank-from-over").addEventListener("click", () => openRank("over"));
  $("btn-rank-close").addEventListener("click", () => {
    rankOverlay.classList.add("hidden");
  });

  // ===== 업데이트 & 렌더 =====
  // f: 60fps 기준 경과 프레임 수 (120Hz면 0.5, 30fps면 2) — 주사율과 무관하게 같은 속도 유지
  function update(f) {
    // 카메라 부드럽게
    cameraY += (cameraTarget - cameraY) * (1 - Math.pow(0.88, f));
    if (shake > 0) shake *= Math.pow(0.85, f);

    if (state === "moving" && mover) {
      mover.x += mover.dir * mover.speed * f;
      // 화면 밖에서 반대편으로 반사 (핑퐁)
      if (mover.dir > 0 && mover.x > VIEW_W - mover.w * 0.15) mover.dir = -1;
      if (mover.dir < 0 && mover.x < -mover.w * 0.85) mover.dir = 1;
    }

    if (state === "dropping" && dropper) {
      dropper.vy += GRAVITY * f;
      dropper.y += dropper.vy * f;
      const targetY = stackTopY() - BOX_H;
      if (dropper.y >= targetY) {
        dropper.y = targetY;
        landDropper();
      }
    }

    for (const d of debris) {
      d.vy += GRAVITY * 0.7 * f;
      d.x += d.vx * f;
      d.y += d.vy * f;
      d.rot += d.vr * f;
      d.alpha -= 0.008 * f;
    }
    debris = debris.filter((d) => d.alpha > 0 && d.y - cameraY < VIEW_H + 200);

    if (flash) {
      flash.time -= f;
      if (flash.time <= 0) flash = null;
    }
  }

  function drawBox(x, y, w, hue, alpha = 1) {
    const sy = y - cameraY;
    if (sy > VIEW_H + BOX_H || sy < -BOX_H * 2) return;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "hsl(" + hue + ", 65%, 55%)";
    ctx.fillRect(x, sy, w, BOX_H);
    // 윗면 하이라이트 / 아랫면 그림자
    ctx.fillStyle = "hsla(" + hue + ", 70%, 72%, .9)";
    ctx.fillRect(x, sy, w, 5);
    ctx.fillStyle = "rgba(0,0,0,.22)";
    ctx.fillRect(x, sy + BOX_H - 5, w, 5);
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);
    ctx.save();
    if (shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // 바닥
    const groundY = floorY - cameraY;
    if (groundY < VIEW_H + 10) {
      ctx.fillStyle = "#0b0d14";
      ctx.fillRect(0, groundY, VIEW_W, VIEW_H - groundY + 10);
      ctx.fillStyle = "#2c3147";
      ctx.fillRect(0, groundY, VIEW_W, 3);
    }

    // 쌓인 박스
    for (const b of stack) drawBox(b.x, b.y, b.w, b.hue);

    // 이동/낙하 중 박스
    if (mover) drawBox(mover.x, mover.y, mover.w, mover.hue);
    if (dropper) drawBox(dropper.x, dropper.y, dropper.w, dropper.hue);

    // 잘린 조각
    for (const d of debris) {
      ctx.save();
      ctx.translate(d.x + d.w / 2, d.y - cameraY + BOX_H / 2);
      ctx.rotate(d.rot);
      ctx.globalAlpha = Math.max(d.alpha, 0);
      ctx.fillStyle = "hsl(" + d.hue + ", 65%, 50%)";
      ctx.fillRect(-d.w / 2, -BOX_H / 2, d.w, BOX_H);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // 퍼펙트 표시
    if (flash) {
      ctx.save();
      ctx.globalAlpha = Math.min(flash.time / 30, 1);
      ctx.fillStyle = "#ffd700";
      ctx.font = "800 30px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(flash.text, VIEW_W / 2, stackTopY() - cameraY - 24);
      ctx.restore();
    }

    ctx.restore();
  }

  let lastTime = 0;
  function loop(now) {
    if (!lastTime) lastTime = now;
    // 탭 전환 등으로 간격이 크게 벌어지면 3프레임까지만 진행 (박스가 순간이동하는 것 방지)
    const f = Math.min((now - lastTime) / (1000 / 60), 3);
    lastTime = now;
    update(f);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  updateHud();

  // 테스트/디버그용 훅 (게임 플레이에는 영향 없음)
  window.__stackTest = {
    getState: () => ({
      state,
      score,
      mover: mover ? { x: mover.x, w: mover.w, dir: mover.dir } : null,
      top: topBox() ? { x: topBox().x, w: topBox().w } : null,
    }),
    drop: onAction,
  };
})();
</script>
</body>
</html>
